name: CI

on:
  push:
    branches: [develop, main, master]
    tags:
      - "v*"
      - "*.*.*"
      - "*.*.*-*"
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS & iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install build tools
        run: |
          brew install just cmake openssl@3

      - name: Build XCFramework
        run: |
          just xcframework

      - name: Package XCFramework bundle
        shell: bash
        run: |
          (cd libs && zip -r ../rppairing.xcframework.zip rppairing.xcframework)
          openssl dgst -sha256 rppairing.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: rppairing-xcframework
          path: rppairing.xcframework.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release update policy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pushed_tag="${GITHUB_REF_NAME}"
          echo "Pushed tag: ${pushed_tag}"

          latest_release_tag=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          echo "Latest release tag on GitHub: ${latest_release_tag}"

          if gh release view "${pushed_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release for tag '${pushed_tag}' already exists on GitHub."
            if [[ -n "${latest_release_tag}" && "${pushed_tag}" != "${latest_release_tag}" ]]; then
              echo "::error::Correcting previous releases (other than last release) is disallowed (pushed: '${pushed_tag}', latest release: '${latest_release_tag}')."
              exit 1
            else
              echo "Pushed tag matches the latest release tag. Update allowed."
            fi
          else
            echo "Release for tag '${pushed_tag}' does not exist yet. New release creation allowed."
          fi

      - name: Download XCFramework artifact
        uses: actions/download-artifact@v4
        with:
          name: rppairing-xcframework
          path: artifacts/rppairing-xcframework

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/rppairing-xcframework/rppairing.xcframework.zip "release/rppairing.xcframework.zip"
          (cd release && sha256sum "rppairing.xcframework.zip" > "rppairing.xcframework.zip.sha256")
          ls -la release

      - name: Create or Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/rppairing.xcframework.zip
            release/rppairing.xcframework.zip.sha256
